<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eventrix</title>
    <style>
      /* Initial Loading Screen Styles */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }

      .loader-logo {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #ffffff;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
      }

      .loader-logo span {
        color: #d32f2f;
        text-shadow: 0 0 20px rgba(211, 47, 47, 0.6);
        animation: pulseLogo 2s infinite;
      }

      .loader-spinner-container {
        position: relative;
        width: 80px;
        height: 80px;
      }

      .loader-spinner {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #d32f2f;
        animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }

      .loader-spinner-inner {
        position: absolute;
        top: 10px;
        left: 10px;
        width: calc(100% - 20px);
        height: calc(100% - 20px);
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-bottom-color: #ffffff;
        animation: spinReverse 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      }

      .loader-text {
        margin-top: 2rem;
        color: #a0a0a0;
        font-size: 0.9rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        animation: pulseText 2s infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes spinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes pulseLogo {
        0%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(211, 47, 47, 0.6); }
        50% { opacity: 0.6; text-shadow: 0 0 10px rgba(211, 47, 47, 0.3); }
      }

      @keyframes pulseText {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-logo">
          eventri<span>x</span>
        </div>
        <div class="loader-spinner-container">
          <div class="loader-spinner"></div>
          <div class="loader-spinner-inner"></div>
        </div>
        <div class="loader-text">Loading System...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
